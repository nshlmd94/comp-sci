<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link href="static/style.css" rel="stylesheet">
    <script src="static/script.js"></script>
    <title>Finance Tracker</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg border-bottom bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Finance Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll"
                aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarScroll">
                {% if session["user_id"] %}
                    <ul class="navbar-nav me-auto my-2 my-lg-0 navbar-nav-scroll" style="--bs-scroll-height: 100px;">
                        <li class="nav-item">
                            <a class="nav-link" href="/quote">Quote</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/buy">Buy</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/sell">Sell</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="history">History</a>
                        </li>
                    </ul>
                    <ul class="d-flex" role="logout">
                        <a class="btn btn-outline-success" href="/logout">Logout</a>
                    </ul>
                {% else %}
                    <ul class="d-flex ms-auto gap-2" role="logout">
                        <a href="/login"><button class="btn btn-outline-success" type="submit">Login</button></a>
                        <a href="/register"><button class="btn btn-outline-success" type="submit">Register</button></a>
                    </ul>
                {% endif %}
            </div> 
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="fixed-bottom text-body-secondary">
            <div class="mx-auto p-2" style="width: 200px;">
                v0.0
            </div>
        </div>
    </footer>

</body>

</html>
