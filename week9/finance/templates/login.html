{% extends "layout.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}
<form class="space w-25 mx-auto mt-5" action="/login" method="post">
    <div class="mb-3">
        <h1>Login</h1>
    </div>
    <div class="mb-3">
        <input type="text" class="form-control w-100" id="formGroupExampleInput validationCustom03" name="username" placeholder="Username" required>
    </div>
    <div class="mb-3">
        <input type="password" class="form-control w-100" id="formGroupExampleInput2 validationCustom03" name="password" placeholder="Password" required>
    </div>
    <div class="mb-3">
        <button class="btn btn-outline-success d-block w-100" type="submit">Login</button>
    </div>
</form>
{% endblock %}
